<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LakeView Pond Mapper v0.2</title>

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.5.0/mapbox-gl-draw.css" rel="stylesheet">
  <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.1.0/mapbox-gl-geocoder.css" rel="stylesheet">

  <style>
    html, body { margin: 0; min-height: 100%; font-family: Arial, sans-serif; background: #f7f7f7; color: #111; }
    #app { max-width: 1200px; margin: 0 auto; background: #fff; min-height: 100vh; }
    header { padding: 16px 18px 10px; border-bottom: 1px solid #ddd; }
    header h1 { margin: 0 0 4px; font-size: 22px; }
    header p { margin: 0; color: #555; font-size: 14px; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto auto;
      gap: 10px;
      padding: 12px 18px;
      border-bottom: 1px solid #e2e2e2;
      align-items: end;
    }
    .field label { display:block; font-size:12px; color:#555; margin-bottom:5px; }
    .field input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 11px;
      font-size: 16px;
      border: 1px solid #bbb;
      border-radius: 7px;
    }
    button {
      padding: 10px 14px;
      font-size: 14px;
      border-radius: 7px;
      border: 1px solid #aaa;
      background: #fff;
      cursor: pointer;
      min-height: 42px;
    }
    button.primary { font-weight: 700; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #map { height: 600px; }
    #results {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      padding: 14px 18px;
      border-top: 1px solid #ddd;
    }
    .card { padding: 12px 14px; border: 1px solid #ddd; border-radius: 8px; }
    .label { color: #666; font-size: 12px; margin-bottom: 5px; }
    .value { font-size: 24px; font-weight: 700; }
    #status {
      padding: 0 18px 14px;
      color: #555;
      font-size: 13px;
    }
    #preview {
      margin: 0 18px 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }
    #preview h2 { margin:0; padding:12px 14px; font-size:16px; border-bottom:1px solid #ddd; }
    #payload {
      margin: 0;
      padding: 14px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Consolas, monospace;
      font-size: 12px;
      background: #fafafa;
    }
    @media (max-width: 800px) {
      .toolbar { grid-template-columns: 1fr 1fr; }
      .field { grid-column: 1 / -1; }
      #map { height: 480px; }
      #results { grid-template-columns: 1fr; }
    }
  #mapWrap {
  position: relative;
}

#mapCrosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  width: 34px;
  height: 34px;
  border: 3px solid white;
  border-radius: 50%;
  color: white;
  font-size: 28px;
  font-weight: bold;
  line-height: 28px;
  text-align: center;
  text-shadow: 0 0 4px black;
  pointer-events: none;
}
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>LakeView Mapper</h1>
<p>Move the crosshair to the shoreline and tap <strong>Add Point</strong>.</p>
  </header>

  <section class="toolbar">
    <div class="field">
      <label for="lakeName">Lake Name</label>
      <input id="lakeName" type="text" placeholder="Example: Lake 7">
    </div>
    
    <button id="redrawBtn" type="button">Redraw</button>
    <button id="addPointBtn" class="primary" type="button">Add Point</button>
    <button id="finishPondBtn" type="button">Finish Pond</button>
    <button id="saveBtn" class="primary" type="button" disabled>Save to LakeView</button>
  </section>

 <div id="mapWrap">
  <div id="map"></div>
  <div id="mapCrosshair">+</div>
</div>
  <section id="results">
    <div class="card">
      <div class="label">Surface Area</div>
      <div class="value" id="acres">—</div>
    </div>
    <div class="card">
      <div class="label">Shoreline Length</div>
      <div class="value" id="feet">—</div>
    </div>
    <div class="card">
      <div class="label">Polygon Points</div>
      <div class="value" id="points">—</div>
    </div>
  </section>

  <div id="status">Search for the site, click Draw Pond, then trace the shoreline. Double-click the last point to finish.</div>

  
</div>

<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-draw/v1.5.0/mapbox-gl-draw.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.1.0/mapbox-gl-geocoder.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>

<script>
  // Replace only the text inside the quotation marks below with your Mapbox default public token.
  mapboxgl.accessToken = 'pk.eyJ1IjoiY3Jvc3Nkb3VnbGFzIiwiYSI6ImNtdGRmdTVrazB2cHUyem9wbzJnN2E0bTMifQ.A6K95rnm5KW3Z55PxeMSbQ';

 const state = {
  mappedAreaAcres: null,
  shorelineLF: null,
  polygonGeoJSON: null,
  mobilePoints: []
};

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/satellite-streets-v12',
    center: [-80.25, 26.4],
    zoom: 9
  });

  map.addControl(new mapboxgl.NavigationControl(), 'top-right');

  const geocoder = new MapboxGeocoder({
    accessToken: mapboxgl.accessToken,
    mapboxgl: mapboxgl,
    marker: false,
    placeholder: 'Search address or place'
  });
  map.addControl(geocoder, 'top-left');

const draw = new MapboxDraw({
  displayControlsDefault: false,
  touchEnabled: true,
  touchBuffer: 40,
  controls: {
    polygon: true,
    trash: true
  }
});
map.addControl(draw, 'top-right');

  const acresEl = document.getElementById('acres');
  const feetEl = document.getElementById('feet');
  const pointsEl = document.getElementById('points');
  const statusEl = document.getElementById('status');
  const saveBtn = document.getElementById('saveBtn');
 
 
  const lakeNameEl = document.getElementById('lakeName');

  function resetMeasurements() {
    state.mappedAreaAcres = null;
    state.shorelineLF = null;
    state.polygonGeoJSON = null;
    acresEl.textContent = '—';
    feetEl.textContent = '—';
    pointsEl.textContent = '—';
    saveBtn.disabled = true;
   
  
  }

  function clearAndDraw() {
  draw.deleteAll();
  resetMeasurements();
  state.mobilePoints = [];
  state.polygonGeoJSON = null;

  statusEl.textContent =
    'Mapping cleared. Move the crosshair to the shoreline and tap Add Point.';
}

  function updateMeasurements() {
    const data = draw.getAll();

    if (!data.features.length) {
      resetMeasurements();
      statusEl.textContent = 'No pond polygon is currently drawn.';
      return;
    }

    const polygon = data.features[data.features.length - 1];
    if (!polygon.geometry || polygon.geometry.type !== 'Polygon') return;

    const areaSqMeters = turf.area(polygon);
    const acres = areaSqMeters / 4046.8564224;

    const ring = polygon.geometry.coordinates[0];
    const line = turf.lineString(ring);
    const perimeterKm = turf.length(line, { units: 'kilometers' });
    const perimeterFeet = perimeterKm * 3280.839895;

    state.mappedAreaAcres = Number(acres.toFixed(4));
    state.shorelineLF = Math.round(perimeterFeet);
    state.polygonGeoJSON = polygon.geometry;

    acresEl.textContent = acres.toFixed(2) + ' ac';
    feetEl.textContent = Math.round(perimeterFeet).toLocaleString() + ' ft';
    pointsEl.textContent = Math.max(0, ring.length - 1).toString();

    saveBtn.disabled = false;
    statusEl.textContent = 'Measurement complete. Adjust any polygon points if needed, then click Preview Save.';
  }
const urlParams = new URLSearchParams(window.location.search);
const lakeId = urlParams.get('lake');
 const rowId = urlParams.get('row'); 
 
  document.getElementById('redrawBtn').addEventListener('click', clearAndDraw);
 document.getElementById('addPointBtn').addEventListener('click', () => {
  const center = map.getCenter();
   state.mobilePoints.push([center.lng, center.lat]);
draw.deleteAll();

if (state.mobilePoints.length === 1) {

  // First point
  draw.add({
    type: 'Feature',
    properties: {},
    geometry: {
      type: 'Point',
      coordinates: state.mobilePoints[0]
    }
  });

} else {

  // Draw the connecting shoreline line
  draw.add({
    type: 'Feature',
    properties: {},
    geometry: {
      type: 'LineString',
      coordinates: state.mobilePoints
    }
  });

  // Draw every waypoint on top of the line
  state.mobilePoints.forEach((point) => {
    draw.add({
      type: 'Feature',
      properties: {},
      geometry: {
        type: 'Point',
        coordinates: point
      }
    });
  });

}

  statusEl.textContent =
  'Point ' + state.mobilePoints.length +
  ' added. Move the map to the next shoreline point.';
});

document.getElementById('finishPondBtn').addEventListener('click', () => {
  if (state.mobilePoints.length < 3) {
    statusEl.textContent = 'Add at least 3 shoreline points before finishing the pond.';
    return;
  }

  const closedCoordinates = [
    ...state.mobilePoints,
    state.mobilePoints[0]
  ];

  const polygonFeature = {
    type: 'Feature',
    properties: {},
    geometry: {
      type: 'Polygon',
      coordinates: [closedCoordinates]
    }
  };

  draw.deleteAll();
  draw.add(polygonFeature);

  state.polygonGeoJSON = polygonFeature.geometry;

  updateMeasurements();

  statusEl.textContent =
    'Pond finished. Review the measurements, then save to LakeView.';
});
  
  saveBtn.addEventListener('click', async () => {
    const lakeName = lakeNameEl.value.trim();

    if (!lakeName) {
      lakeNameEl.focus();
      statusEl.textContent = 'Enter a Lake Name before previewing the save.';
      return;
    }

    if (!state.polygonGeoJSON) {
      statusEl.textContent = 'Draw a pond polygon first.';
      return;
    }
const imageFeature = {
  type: "Feature",
  properties: {
    stroke: "#ff9900",
    "stroke-width": 3,
    "stroke-opacity": 1,
    fill: "#ff9900",
    "fill-opacity": 0.08
  },
  geometry: state.polygonGeoJSON
};

const lakeImage =
  "https://api.mapbox.com/styles/v1/mapbox/satellite-v9/static/geojson(" +
  encodeURIComponent(JSON.stringify(imageFeature)) +
  ")/auto/800x500?padding=50&access_token=" +
  mapboxgl.accessToken;
    const payload = {
      lakeId:lakeId,
      rowId: rowId,
      lakeName: lakeName,
      mappedAreaAcres: state.mappedAreaAcres,
      shorelineLF: state.shorelineLF,
      lakePolygon: JSON.stringify(state.polygonGeoJSON),
      lakeImage: lakeImage,
      mappingStatus: 'Mapped',
      lastMapped: new Date().toISOString()
    };
    const response = await fetch(
  "https://lakeview-glide-bridge.chris-19d.workers.dev/",
  {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  }
);

const result = await response.json();

if (!response.ok || !result.ok) {
  throw new Error(result.error || result.message || "Save failed");
}

statusEl.textContent = "Saved successfully to LakeView.";

    
  
    statusEl.textContent =
  '✓ Mapping saved to LakeView — ' +
  state.mappedAreaAcres.toFixed(2) +
  ' acres · ' +
  Math.round(state.shorelineLF).toLocaleString() +
  ' ft shoreline';
  
  });

  map.on('draw.create', updateMeasurements);
  map.on('draw.update', updateMeasurements);
  
  map.on('load', async () => {
  if (!lakeId) {
    statusEl.textContent =
      'Search for the site, click Draw Pond, then trace the shoreline.';
    return;
  }

  statusEl.textContent = 'Loading Waterbody: ' + lakeId + '...';

  try {
    const response = await fetch(
      'https://lakeview-glide-bridge.chris-19d.workers.dev/?lakeId=' +
      encodeURIComponent(lakeId)
    );

    const result = await response.json();

    if (!response.ok || !result.ok || !result.lake) {
      throw new Error(result.error || 'Could not load lake');
    }

    const lake = result.lake;

    if (lake.LakeName) {
      lakeNameEl.value = lake.LakeName;
    }

    const savedPolygon = lake['LLake Polygon'];

    if (savedPolygon) {
      const geometry =
        typeof savedPolygon === 'string'
          ? JSON.parse(savedPolygon)
          : savedPolygon;

      draw.add({
        type: 'Feature',
        properties: {},
        geometry: geometry
      });

      updateMeasurements();

      const bounds = turf.bbox({
        type: 'Feature',
        properties: {},
        geometry: geometry
      });

      map.fitBounds(
        [
          [bounds[0], bounds[1]],
          [bounds[2], bounds[3]]
        ],
        {
          padding: 60,
          duration: 800
        }
      );

      statusEl.textContent =
        'Loaded ' + lakeId + '. Adjust the shoreline if needed, then save.';
    } else {
      statusEl.textContent =
        'Mapping Waterbody: ' + lakeId +
        '. Search for the site, click Draw Pond, then trace the shoreline.';
    }

  } catch (error) {
    console.error(error);
    statusEl.textContent =
      'Could not load the existing map. You can still draw the pond manually.';
  }
});
</script>
</body>
</html>
